FilterCVsByJobTitle:
  description: >
    Scan all CVs in the provided folder and filter candidates based on their expected job title.

    Steps:
    - Read each CV from the specified folder.
    - Extract the candidate's expected job title or career objective.
    - Compare it with the provided job description.
    - Select only CVs that match the job description.

  expected_output: >
    A list of filtered CVs that match the job description.
    Output Format:
    - Candidate Name
    - Expected Job Title
    - CV File Path
    - Filtering Status: Accepted / Rejected
  agent: CVFilteringAgent

ExtractCVDetails:
  description: >
    Extract and summarize details from each selected PDF by taking each file path from knowledge base.
    Key details include Name, Contact Information, Skills, Work Experience, Education, and Certifications.
  expected_output: >
    - Structured CV details, including:
      - Full Name
      - Contact Information
      - Skills
      - Work Experience
      - Education
      - Certifications
      - Relevant Keywords
    - Summarized profile for easy comparison.
  agent: CVExtractionAgent

StoreCVDetails:
  description: >
    Store the extracted CV details in a structured knowledge base for comparison.
  expected_output: >
    - CV data saved in a structured format for quick retrieval.
    - Organized candidate profiles stored in a knowledge base.
  agent: CVExtractionAgent

EvaluateSkillProficiency:
  description: >
    Review the extracted skills and technologies from each CV.
    Determine the expertise level of the candidate for each technology based on their experience, projects, and certifications.

    Skill Levels:
    - Beginner: Mentioned but lacks relevant experience.
    - Intermediate: Has relevant experience but lacks advanced projects.
    - Expert: Demonstrates deep knowledge, certifications, and extensive project experience.

  expected_output: >
    A structured list of skill evaluations per candidate, formatted as:
    - Candidate Name: [Name]
    - Skill: [Skill Name], Proficiency Level: [Beginner/Intermediate/Expert]
    - Supporting Evidence: [Extracted details justifying the evaluation]
  agent: CVEvaluationAgent

CompareCVWithJobDescription:
  description: >
    Compare the extracted CV details with {job_description} and rank candidates based on relevance.
  expected_output: >
    - A ranked list of candidates based on their match percentage with {job_description}.
    - Justification for ranking based on required skills, experience, and qualifications.
    - Identification of top candidates with key strengths highlighted.
  agent: CVMatchingAgent

SOPValidationTask:
  description: >
    Validate the extracted CV information and flag any missing details.

    Steps:
    - Check if all required sections are present: Skills, Experience, Education, Certifications.
    - If a section is missing, flag it but do not exclude the CV.
    - Continue processing even if some details are missing.
    - Ensure a flag is added to incomplete CVs for ranking adjustment.

  expected_output: >
    A validation report for each CV with:
    - **Validation Status: Pass / Needs Review**
    - **Missing Fields** (if any)
    - **Decision**: Include in ranking with adjusted score.
  agent: SOPValidationAgent

RankCandidatesTask:
  description: >
    Rank candidates based on available information, even if some details are missing.

    Steps:
    - Use scores from CVMatchingAgent and SOPValidationAgent.
    - If key details are missing, adjust ranking score but do not exclude the CV.
    - Ensure rankings reflect the best available data.

  expected_output: >
    A ranked list of candidates with:
    - Candidate Name
    - Overall Match Percentage (adjusted if missing fields)
    - Missing Fields (if any)
    - Strengths and Weaknesses Summary
  agent: RankingAgent

GenerateFinalReportTask:
  description: >
    Compile a well-structured report summarizing the top 5 candidates based on rankings.

    Your report should include:
    - Top 5 ranked candidates with match percentages.
    - Key strengths and standout qualities for each candidate.
    - Any skill gaps or concerns that need attention.
    - Final recommendations for hiring decisions.

  expected_output: >
    A structured markdown report containing:
    - **Executive Summary**
    - **Candidate Rankings (Top 5)**
    - **Detailed Analysis for Each Candidate**
    - **Strengths and Weaknesses**
    - **Final Recommendations**

